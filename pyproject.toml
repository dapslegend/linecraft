[project]
name = "linecraft"
version = "0.2.0"
description = "Public sports price analysis and share-only booking. No staking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Linecraft" }]

[project.optional-dependencies]
dev = []

[project.scripts]
linecraft = "linecraft.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
